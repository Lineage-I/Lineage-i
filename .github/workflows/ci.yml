name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Smart contract ──────────────────────────────────────────────────────────
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract tests
        working-directory: contract
        run: cargo test --features testutils

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: "ci-test-secret-at-least-32-chars-long"
      CONTRACT_ID: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM"
      ADMIN_SECRET_KEY: "SCZANGBA5AAAH4D2FFMDJBVTABFUHBWFLU2OVAP7PKLQYQLWXKCIQB3K"
      SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Push schema (SQLite for CI)
        working-directory: backend
        run: npx prisma db push --schema=prisma/schema.test.prisma --skip-generate

      - name: TypeScript build
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:3000"
          VITE_CONTRACT_ID: "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM"
          VITE_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          VITE_STELLAR_EXPLORER: "https://stellar.expert/explorer/testnet"
